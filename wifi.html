<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi 二维码生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-10 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto w-full space-y-8">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">WiFi 二维码生成器</h1>
            <p class="text-sm text-gray-500">输入网络信息，一键生成专属扫码连接二维码，支持下载与打印。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
            <!-- Form Card -->
            <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-xl shadow-gray-200/50 space-y-6">
                <div class="space-y-4">
                    <!-- SSID -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">WiFi 名称 (SSID)</label>
                        <input type="text" id="ssid" placeholder="例如：MyHome_WiFi" class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-sm">
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">WiFi 密码</label>
                        <input type="text" id="password" placeholder="请输入 WiFi 密码" class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-sm">
                    </div>

                    <!-- Encryption Type -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">加密类型 (Authentication)</label>
                        <select id="encryption" class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition-all text-sm">
                            <option value="WPA" selected>WPA / WPA2 / WPA3 (绝大多数设备)</option>
                            <option value="WEP">WEP (较旧的网络)</option>
                            <option value="nopass">无密码 (开放网络)</option>
                        </select>
                    </div>

                    <!-- Hidden SSID -->
                    <div class="flex items-center justify-between pt-2">
                        <span class="text-xs font-semibold uppercase tracking-wider text-gray-600">隐藏网络 (Hidden SSID)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="hidden" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                </div>

                <button onclick="generateQRCode()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-medium rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm">
                    生成二维码
                </button>
            </div>

            <!-- Preview Card -->
            <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-xl shadow-gray-200/50 flex flex-col items-center justify-center text-center space-y-6 min-h-[380px]">
                <div id="qrcode-container" class="p-4 bg-white rounded-2xl shadow-inner border border-gray-100 flex items-center justify-center">
                    <div id="qrcode"></div>
                </div>
                <div id="placeholder-text" class="text-gray-400 text-sm">
                    请在左侧填写信息并点击生成
                </div>
                
                <div id="action-buttons" class="hidden w-full space-y-3">
                    <button onclick="downloadQRCode()" class="w-full py-3 bg-gray-900 hover:bg-black text-white font-medium rounded-xl transition-all text-sm shadow-md">
                        保存二维码图片
                    </button>
                    <button onclick="printCard()" class="w-full py-3 bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 font-medium rounded-xl transition-all text-sm">
                        打印 WiFi 提示牌
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 mt-10">
        WiFi QR Code Generator &bull; Designed with Minimalist Style
    </footer>

    <!-- Print Template Area -->
    <div id="print-area" class="hidden print:block fixed inset-0 bg-white z-50 p-12 text-center">
        <div class="max-w-md mx-auto border-2 border-dashed border-gray-300 rounded-3xl p-8 space-y-6">
            <h2 class="text-2xl font-bold text-gray-900">扫码连接 WiFi</h2>
            <div id="print-qrcode" class="flex justify-center my-4"></div>
            <p class="text-xs text-gray-400">请使用手机相机直接扫描二维码连接网络</p>
        </div>
    </div>

    <script>
        let qrcodeObj = null;

        function generateQRCode() {
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value;
            const encryption = document.getElementById('encryption').value;
            const hidden = document.getElementById('hidden').checked ? 'true' : 'false';

            if (!ssid) {
                alert('请输入 WiFi 名称 (SSID)');
                return;
            }

            let wifiString = `WIFI:S:${escapeSpecialChars(ssid)};T:${encryption};P:${escapeSpecialChars(password)};H:${hidden};;`;

            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = '';

            qrcodeObj = new QRCode(qrcodeContainer, {
                text: wifiString,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('placeholder-text').style.display = 'none';
            document.getElementById('action-buttons').classList.remove('hidden');

            const printQrcodeContainer = document.getElementById('print-qrcode');
            printQrcodeContainer.innerHTML = '';
            new QRCode(printQrcodeContainer, {
                text: wifiString,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function escapeSpecialChars(str) {
            return str.replace(/([\\;,:\"])/g, '\\$1');
        }

        function downloadQRCode() {
            const img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
            if (!img) return;

            let imageUrl = '';
            if (img.tagName === 'CANVAS') {
                imageUrl = img.toDataURL('image/png');
            } else {
                imageUrl = img.src;
            }

            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = 'wifi-qrcode.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function printCard() {
            window.print();
        }
    </script>
</body>
</html>
